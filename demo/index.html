<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>点赞视频画廊 · 静态演示</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui,"Noto Sans CJK SC",sans-serif}
.notice{background:#1f6feb22;border-bottom:1px solid #1f6feb55;color:#9ecbff;font-size:12.5px;padding:8px 16px;line-height:1.6}
.notice b{color:#58a6ff}
header{position:sticky;top:0;z-index:30;background:#161b22;border-bottom:1px solid #21262d;padding:10px 16px}
h1{font-size:15px;margin:0 0 8px;font-weight:600}
h1 span{color:#8b949e;font-weight:400;font-size:12px;margin-left:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=search]{background:#0d1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px;padding:6px 10px;font-size:13px;flex:1;min-width:180px;max-width:320px}
select{background:#0d1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px;padding:6px 8px;font-size:12.5px}
#cnt{color:#8b949e;font-size:12px;margin-left:auto;white-space:nowrap}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tab{background:#0d1117;border:1px solid #30363d;color:#8b949e;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;user-select:none}
.tab.on{background:#1f6feb;border-color:#1f6feb;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;padding:14px 16px 40px}
.card{background:#161b22;border:1px solid #21262d;border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:#1f6feb}
.thumb{position:relative;aspect-ratio:9/14;background:#0b0d11;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:6px;bottom:6px;background:#000c;padding:1px 6px;border-radius:4px;font-size:11px}
.badge{position:absolute;left:6px;top:6px;background:#d29922dd;color:#1a1207;font-size:10.5px;padding:1px 5px;border-radius:4px;font-weight:600}
.meta{padding:8px 10px 10px}
.t{font-size:12.5px;line-height:1.4;height:36px;overflow:hidden}
.s{font-size:11px;color:#8b949e;margin-top:4px;display:flex;justify-content:space-between;gap:6px}
.s b{color:#d2a8ff;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modal{position:fixed;inset:0;background:#000d;display:none;z-index:50;align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}
.player{background:#161b22;border:1px solid #30363d;border-radius:12px;max-width:min(460px,96vw);width:100%;overflow:hidden}
.phead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13px;border-bottom:1px solid #21262d;gap:10px}
.pclose{cursor:pointer;color:#8b949e;font-size:18px;line-height:1}
video{width:100%;background:#000;display:block;max-height:76vh}
#pmsg{padding:8px 14px;font-size:12px;color:#8b949e}
</style>
</head>
<body>
<div class="notice">
  <b>这是静态演示页</b>：数据为虚构样本，视频是本地生成的示例片段，用于展示筛选与播放的交互效果。<br>
  真实版本需要本地运行 <code>node scripts/gallery_server.mjs</code>（见 <a href="../README.md" style="color:#58a6ff">README</a>），它会按需向抖音换取新鲜的播放地址。
</div>
<header>
  <h1>点赞视频画廊<span>共 12 条示例 · 点卡片直接播放</span></h1>
  <div class="row">
    <input id="q" type="search" placeholder="搜索标题 / 作者…">
    <select id="msel"><option value="0">全部月份</option></select>
    <select id="sort">
      <option value="o">点赞顺序（最近的在前）</option>
      <option value="d">发布时间（新的在前）</option>
      <option value="g">点赞数（高的在前）</option>
      <option value="s">时长（长的在前）</option>
    </select>
    <span id="cnt"></span>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="grid" id="grid"></div>

<div id="modal">
  <div class="player">
    <div class="phead">
      <b id="ptitle" style="font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></b>
      <span class="pclose" id="pclose">×</span>
    </div>
    <video id="pv" controls playsinline></video>
    <div id="pmsg"></div>
  </div>
</div>

<script>
// 虚构样本：封面用内联 SVG 渐变，视频用 demo/clips 下的示例片段
function cover(a, b, label) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="360" height="560">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>
    <rect width="360" height="560" fill="url(#g)"/>
    <circle cx="${60 + Math.random() * 240}" cy="${140 + Math.random() * 280}" r="80" fill="#ffffff18"/>
    <text x="180" y="500" text-anchor="middle" font-family="sans-serif" font-size="20"
      fill="#ffffffcc">${label}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

const DATA = [
  { id:'d01', t:'凌晨四点的菜市场，第一批摊主已经开工', a:'示例作者·清晨', y:2026, m:10, d:'2026-10-18', s:126, g:2431, o:0, clip:1 },
  { id:'d02', t:'三分钟学会一道快手菜：蒜香黄油虾', a:'示例作者·厨房', y:2026, m:10, d:'2026-10-12', s:188, g:5820, o:1, clip:2 },
  { id:'d03', t:'城市夜跑第一视角，配速 5\'30"', a:'示例作者·跑道', y:2026, m:9, d:'2026-09-27', s:63, g:912, o:2, clip:3 },
  { id:'d04', t:'把旧手机做成桌面时钟，成本 20 元', a:'示例作者·折腾', y:2026, m:9, d:'2026-09-15', s:412, g:15600, o:3, clip:1 },
  { id:'d05', t:'猫咪第一次见到雪的反应', a:'示例作者·猫屋', y:2025, m:12, d:'2025-12-21', s:34, g:88230, o:4, clip:2 },
  { id:'d06', t:'一个人的年夜饭，也值得认真做', a:'示例作者·灶台', y:2025, m:1, d:'2025-01-28', s:245, g:4120, o:5, clip:3 },
  { id:'d07', t:'徒步 18 公里，山顶的云海值回票价', a:'示例作者·山里', y:2025, m:5, d:'2025-05-03', s:96, g:2640, o:6, clip:1 },
  { id:'d08', t:'老式收音机修复全过程', a:'示例作者·修理铺', y:2024, m:11, d:'2024-11-09', s:520, g:3120, o:7, clip:2 },
  { id:'d09', t:'城市里的老书店，开了 30 年', a:'示例作者·纸页', y:2024, m:3, d:'2024-03-16', s:158, g:1240, o:8, clip:3 },
  { id:'d10', t:'第一次用胶片拍夜景', a:'示例作者·暗房', y:2023, m:8, d:'2023-08-02', s:72, g:860, o:9, clip:1, img:1 },
  { id:'d11', t:'把阳台改成了小花园', a:'示例作者·绿植', y:2023, m:4, d:'2023-04-11', s:203, g:5310, o:10, clip:2 },
  { id:'d12', t:'雨天的窗，和一杯热茶', a:'示例作者·慢生活', y:2022, m:7, d:'2022-07-19', s:41, g:412, o:11, clip:3 },
];
const PALETTE = [
  ['#1f6feb', '#0d1117'], ['#d29922', '#161b22'], ['#3fb950', '#0d1117'],
  ['#bc8cff', '#161b22'], ['#f85149', '#0d1117'], ['#39c5cf', '#161b22'],
];
DATA.forEach((x, i) => { const [a, b] = PALETTE[i % PALETTE.length]; x.c = cover(a, b, x.a.replace('示例作者·', '')); });

const PAGE = 60;
let view = [], shown = 0, year = 0, month = 0;
const $ = (id) => document.getElementById(id);
const grid = $('grid'), q = $('q'), msel = $('msel'), sortSel = $('sort'), cnt = $('cnt'), tabs = $('tabs');

const years = {}; DATA.forEach(d => years[d.y] = (years[d.y] || 0) + 1);
function buildTabs() {
  tabs.innerHTML = '';
  const mk = (label, val) => {
    const t = document.createElement('div');
    t.className = 'tab' + (year === val ? ' on' : '');
    t.textContent = label; t.onclick = () => { year = val; rebuild(); };
    return t;
  };
  tabs.appendChild(mk('全部 ' + DATA.length, 0));
  Object.keys(years).sort((a, b) => b - a).forEach(y => tabs.appendChild(mk(y + ' (' + years[y] + ')', Number(y))));
}
for (let m = 1; m <= 12; m++) { const o = document.createElement('option'); o.value = m; o.textContent = m + ' 月'; msel.appendChild(o); }

const fmtDur = s => s ? (s < 60 ? s + 's' : Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')) : '';
const esc = s => (s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

function rebuild() {
  const kw = q.value.trim().toLowerCase();
  view = DATA.filter(d => (!year || d.y === year) && (!month || d.m === month)
    && (!kw || d.t.toLowerCase().includes(kw) || d.a.toLowerCase().includes(kw)));
  const by = sortSel.value;
  view.sort((a, b) => by === 'o' ? a.o - b.o : by === 'd' ? (a.d < b.d ? 1 : -1) : by === 'g' ? b.g - a.g : b.s - a.s);
  grid.innerHTML = ''; shown = 0; addCards(); buildTabs();
}

function addCards() {
  const frag = document.createDocumentFragment();
  for (const d of view.slice(shown, shown + PAGE)) {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="thumb">
        <img loading="lazy" src="${d.c}" alt="">
        ${d.img ? '<span class="badge">图集</span>' : ''}
        ${d.s ? `<span class="dur">${fmtDur(d.s)}</span>` : ''}
      </div>
      <div class="meta">
        <div class="t">${esc(d.t)}</div>
        <div class="s"><b>@${esc(d.a)}</b><span>${d.d} · ❤${d.g}</span></div>
      </div>`;
    el.onclick = () => play(d);
    frag.appendChild(el);
  }
  grid.appendChild(frag);
  shown += Math.min(PAGE, Math.max(0, view.length - shown));
  cnt.textContent = shown + ' / ' + view.length + ' 条';
}

const modal = $('modal'), pv = $('pv'), pmsg = $('pmsg'), ptitle = $('ptitle');
function play(d) {
  ptitle.textContent = d.t;
  pmsg.textContent = '（演示）真实版本这里会实时向抖音换取播放地址';
  pv.src = 'clips/sample-' + d.clip + '.webm';
  pv.play().catch(() => {});
  modal.classList.add('on');
}
$('pclose').onclick = () => { modal.classList.remove('on'); pv.pause(); pv.removeAttribute('src'); };
modal.onclick = e => { if (e.target === modal) $('pclose').click(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('pclose').click(); });

q.addEventListener('input', rebuild);
msel.addEventListener('change', () => { month = Number(msel.value); rebuild(); });
sortSel.addEventListener('change', rebuild);
rebuild();
</script>
</body>
</html>
